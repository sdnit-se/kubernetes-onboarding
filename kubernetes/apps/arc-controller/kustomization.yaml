apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
helmCharts:
  - name: gha-runner-scale-set-controller
    repo: oci://ghcr.io/actions/actions-runner-controller-charts
    version: 0.15.0
    # arc-runners refers to the controller's service account by this name.
    releaseName: arc
    namespace: arc-systems
    includeCRDs: true
